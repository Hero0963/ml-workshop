[project]
name = "language-models-course"
version = "0.1.0"
description = "A hands-on course on language models: word2vec, tokenizers, GPT-2, training at scale, post-training and embedding models."
readme = "README.md"
requires-python = ">=3.11"
# Filled in by `uv add` (see README "Setup"): per the repo rules, packages are added by the
# developer, not by an agent. The index routing below is already in place, so a plain
# `uv add torch` resolves the CUDA build.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lm_course"]

# CUDA 12.6 wheels: the newest torch on this index covers drivers from CUDA 12.6 up.
# The index is `explicit`, so uv consults it only for the packages routed to it in
# [tool.uv.sources]; everything else still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (downloads files); skipped when offline"]

[tool.ruff]
# Notebooks keep their executed output as the record of a run, and their ad-hoc cells are
# the teaching material; the repo-level pre-commit hook skips them for the same reason.
extend-exclude = ["notebooks"]
