# docker-compose.dev.yml
# The DEVELOPMENT app: volume mounts for hot-reloading both frontend and backend.
#
#     python start.py --dev                                  # recommended
#
# or by hand:
#
#     docker compose -f docker-compose.ollama.yml up -d      # once per machine
#     docker compose -f docker-compose.dev.yml up -d --build
#
# The app container starts uvicorn itself with --reload. It used to idle on
# `tail -f /dev/null` and wait for `run_docker_dev.py` to exec a server into it,
# which never returned and left the health check unreachable.
#
# Same identity rules as docker-compose.yml: start.py names this project
# `zip-dev-<checkout dir>`, nothing hardcodes a container or image name, and Ollama is in
# docker-compose.ollama.yml. The name below only matters without start.py: it keeps a
# plain `docker compose` from putting dev and prod in one project, where their images
# would share a tag and each build would replace the other.

name: linkedin-zip-challenge-dev

services:
  zip-challenge-app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.dev  # <--- Points to the .dev Dockerfile
    ports:
      - "${APP_PORT:-7440}:${APP_PORT:-7440}"
    env_file:
      - ./.env
    environment:
      # See docker-compose.yml: the host-side address in `.env` is wrong inside a
      # container, and Ollama is reached through the port it publishes on the host.
      - OLLAMA_PROVIDER_URL=http://host.docker.internal:${OLLAMA_HOST_PORT:-11435}/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      # The RL solver's checkpoints, read-only. `models/` is 6.6GB and not in version
      # control, so it is mounted rather than baked; without it /api/solver/solve answers
      # 503 for the RL solver and every other solver still works.
      - ./models:/app/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-7440}/api/echo/health',
          timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stdin_open: true
    tty: true
    restart: on-failure

  svelte-frontend:
    build:
      context: ./src/custom_components/puzzle_editor/frontend
      dockerfile: Dockerfile
    ports:
      # vite always listens on 5173 inside; only the host side moves per checkout.
      - "${SVELTE_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://zip-challenge-app:${APP_PORT}
      - SVELTE_PORT=5173
    env_file:
      - ./.env
    volumes:
      - ./src/custom_components/puzzle_editor/frontend:/app
      - /app/node_modules
    depends_on:
      - zip-challenge-app
    stdin_open: true
    tty: true
    restart: on-failure
