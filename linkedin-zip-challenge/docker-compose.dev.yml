# docker-compose.dev.yml
# This docker-compose file is for DEVELOPMENT.
# It uses volume mounts for hot-reloading both frontend and backend.
#
#     docker compose -f docker-compose.dev.yml up -d --build
#
# The app container starts uvicorn itself with --reload. It used to idle on
# `tail -f /dev/null` and wait for `run_docker_dev.py` to exec a server into it,
# which never returned and left the health check unreachable.

services:
  ollama:
    image: ollama/ollama:latest
    # NOTE: deliberately NOT named `ollama_server` - that name is taken by another
    # project on this machine (freelancer-ai-translator). Same reason the host port
    # is configurable: several local stacks each ship their own Ollama.
    container_name: zip_ollama_server
    environment:
      - OLLAMA_CONTEXT_LENGTH=8192
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
      # Read-only so `ollama create` can import a locally merged checkpoint without
      # copying ~9GB into the container layer. `models/` is git-ignored; the directory
      # is created by the P4d merge step and is absent on a fresh clone, which Docker
      # handles by creating an empty one.
      - ./models:/models:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  zip-challenge-app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.dev  # <--- Points to the .dev Dockerfile
    container_name: zip_challenge_dev_app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - ./.env
    environment:
      # `.env` holds the host-side address, because that is how the app is usually run
      # (`uv run python -m src.app.main`). Inside the compose network 127.0.0.1 is this
      # container, not the ollama one, so it is overridden here -- `environment:` takes
      # precedence over `env_file:`, which keeps both ways of running correct without
      # asking anyone to remember to edit `.env` when they switch.
      - OLLAMA_PROVIDER_URL=http://ollama:11434/v1
    volumes:
      - ./src:/app/src
      # The RL solver's checkpoints, read-only. `models/` is 6.6GB and not in version
      # control, so it is mounted rather than baked; without it /api/solver/solve answers
      # 503 for the RL solver and every other solver still works.
      - ./models:/app/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-7440}/api/echo/health',
          timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stdin_open: true
    tty: true
    restart: on-failure

  svelte-frontend:
    build:
      context: ./src/custom_components/puzzle_editor/frontend
      dockerfile: Dockerfile
    container_name: svelte_frontend_dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://zip-challenge-app:${APP_PORT}
      - SVELTE_PORT=5173
    env_file:
      - ./.env
    volumes:
      - ./src/custom_components/puzzle_editor/frontend:/app
      - /app/node_modules
    depends_on:
      - zip-challenge-app
    stdin_open: true
    tty: true
    restart: on-failure

volumes:
  ollama_data:
    # Pinned to the pre-existing volume so the ~15GB of models pulled in 2025-10
    # (qwen2.5vl:7b, openbmb/minicpm-o2.6, bsahane/Qwen2.5-VL-7B-Instruct) survive.
    name: linkedin-zip-challenge_ollama_data
