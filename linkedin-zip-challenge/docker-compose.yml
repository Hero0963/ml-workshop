# docker-compose.yml
# The PRODUCTION stack: one command brings up everything the app needs.
#
#     docker compose up -d --build
#
# The image is self-contained (multi-stage build: Svelte frontend, then the Python app),
# so there is no source mount and an edit on the host changes nothing until a rebuild --
# that immutability is the point. For hot reload use `docker-compose.dev.yml`.
#
# ⚠ The two files declare the same container names and share `ollama_data`, so they are
# alternatives, not layers: bring one down before starting the other.
#
# What runs here and why:
#   ollama            - serves the fine-tuned vision-language model that /api/vision/solve
#                       reads screenshots with. Needs the GPU.
#   zip-challenge-app - FastAPI + Gradio + the built Svelte editor, and the RL solver.

services:
  ollama:
    image: ollama/ollama:latest
    # NOTE: deliberately NOT named `ollama_server` - that name is taken by another
    # project on this machine. Same reason the host port is configurable: several local
    # stacks each ship their own Ollama.
    container_name: zip_ollama_server
    environment:
      - OLLAMA_CONTEXT_LENGTH=8192
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
      # Read-only so `ollama create` can import a locally merged checkpoint without
      # copying ~9GB into the container layer.
      - ./models:/models:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  zip-challenge-app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: zip_challenge_prod_app
    ports:
      - "${APP_PORT:-7440}:${APP_PORT:-7440}"
    env_file:
      - ./.env
    environment:
      # `.env` holds the host-side address, because that is how the app is usually run
      # (`uv run python -m src.app.main`). Inside the compose network 127.0.0.1 is this
      # container, not the ollama one, so it is overridden here -- `environment:` takes
      # precedence over `env_file:`, which keeps both ways of running correct without
      # asking anyone to remember to edit `.env` when they switch.
      - OLLAMA_PROVIDER_URL=http://ollama:11434/v1
    volumes:
      # The RL solver's checkpoints. `models/` is 6.6GB and not in version control, so it
      # is mounted rather than baked: the image stays small and a machine without trained
      # weights still starts -- /api/solver/solve answers 503 for the RL solver and every
      # other solver keeps working.
      - ./models:/app/models:ro
    depends_on:
      # Started, not healthy: the vision endpoint is the only thing that needs Ollama, and
      # the model runtime takes far longer to come up than the app. A 503 from one
      # endpoint beats the whole stack waiting.
      ollama:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-7440}/api/echo/health',
          timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stdin_open: true
    tty: true
    restart: on-failure

volumes:
  ollama_data:
    # Pinned to the pre-existing volume so the ~15GB of models pulled in 2025-10
    # (qwen2.5vl:7b, openbmb/minicpm-o2.6, bsahane/Qwen2.5-VL-7B-Instruct) and the
    # fine-tuned `zip-qwen35-4b-p4c` tag survive.
    name: linkedin-zip-challenge_ollama_data
